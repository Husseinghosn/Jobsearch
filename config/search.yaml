# What to search for. Edit this file.
search:
  titles:
    - "Software Engineer"
    - "Backend Engineer"
  must_have_skills: ["Python"]
  nice_to_have_skills: ["AWS", "PostgreSQL"]
  seniority: ["mid", "senior"]          # intern | junior | mid | senior | staff
  locations: ["Remote - US", "New York, NY"]
  remote_ok: true
  posted_within_days: 7

# Where to look. Order = priority. ATS boards (Greenhouse/Lever/Ashby) are the
# most automation-friendly. LinkedIn/Indeed forbid automation in their ToS —
# keep them to search-only, or leave them out.
sites:
  - name: google_jobs
    url: "https://www.google.com/search?q={query}&ibp=htl;jobs"
  - name: greenhouse
    url: "https://www.google.com/search?q=site%3Aboards.greenhouse.io+{query}"
  - name: lever
    url: "https://www.google.com/search?q=site%3Ajobs.lever.co+{query}"
  - name: ashby
    url: "https://www.google.com/search?q=site%3Ajobs.ashbyhq.com+{query}"
  # - name: linkedin        # search-only; do not auto-apply
  #   url: "https://www.linkedin.com/jobs/search/?keywords={query}&location={location}&f_TPR=r604800"

filters:
  min_salary: 120000              # annual, in USD; ignored if a posting has no salary
  exclude_keywords: ["clearance required", "unpaid", "commission only"]
  exclude_companies: []
  min_score_to_shortlist: 60

limits:
  max_new_jobs_per_run: 25
  max_applications_per_day: 10

apply:
  # assisted: fill the form, stop before Submit, wait for your "yes"
  # review:   don't open forms at all; just build the shortlist
  # auto:     submit without asking — ONLY on auto_submit_hosts and score >= auto_min_score
  mode: assisted
  auto_min_score: 85
  auto_submit_hosts: ["boards.greenhouse.io", "job-boards.greenhouse.io", "jobs.lever.co", "jobs.ashbyhq.com"]
  tailor_cover_letter: true       # write a short role-specific cover letter when a field allows one
